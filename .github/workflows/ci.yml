name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: build + test (Linux)
    # Linux-only: raylib-zig transitively pulls hexops/xcode-frameworks via
    # git+https, which Zig's fetcher can't resolve on the macos runner.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install raylib system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libsdl2-dev
      - name: Build + test
        run: zig build test

  # Integration: generate + build the raylib desktop example (which now lives
  # here, not in labelle-assembler — the agnosticism remainder of #520). Verifies
  # the backend works end-to-end through the toolkit. The example pins released
  # core/engine/gfx (fetched) + THIS repo as its backend (backend_package
  # local:../..) + the assembler/cli as siblings (built from main so the example
  # tracks unreleased toolchain fixes, mirroring labelle-bgfx's example job).
  # Linux-only for the same reason as build-test (raylib-zig's git+https
  # xcode-frameworks fetch fails on the macOS runner).
  raylib-example:
    name: raylib desktop example generate + build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout labelle-raylib
        uses: actions/checkout@v4
        with:
          path: labelle-raylib
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout labelle-cli (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: main
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install raylib system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libsdl2-dev

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            labelle-raylib/examples/raylib/.labelle
          key: raylib-example-${{ hashFiles('labelle-raylib/examples/raylib/project.labelle', 'labelle-raylib/build.zig.zon') }}
          restore-keys: |
            raylib-example-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: cd labelle-cli && zig build

      - name: Generate + build the raylib desktop example
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          set -euo pipefail
          cd labelle-raylib/examples/raylib
          $GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle generate
          # The generated desktop project lands at .labelle/<backend>_desktop;
          # find its build.zig robustly (excluding the copied deps/ trees).
          proj=$(find .labelle -maxdepth 2 -name build.zig -not -path '*/deps/*' | head -1)
          if [ -z "$proj" ]; then echo "generated build.zig not found"; exit 1; fi
          echo "building: $proj"
          cd "$(dirname "$proj")"
          zig build

  # Integration: generate + build the gamepad desktop example — same shape as
  # raylib-example above, but the example additionally exercises the `imgui`
  # GUI plugin (rlImGui raylib bridge) for its HUD. The plugin is the
  # assembler's BUNDLED imgui plugin (path-pinned to
  # `labelle-assembler/plugins/imgui`), NOT the published `labelle-imgui`
  # package: only the bundled copy pins the rlImGui raylib bridge against a
  # raylib-zig that builds on Zig 0.16 (labelle-imgui#25). The backend is
  # still THIS repo (backend_package local:../..). Linux-only for the same
  # raylib-zig xcode-frameworks reason as the jobs above.
  gamepad-example:
    name: gamepad desktop example generate + build
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout labelle-raylib
        uses: actions/checkout@v4
        with:
          path: labelle-raylib
          persist-credentials: false

      - name: Checkout labelle-assembler (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-assembler
          ref: main
          path: labelle-assembler
          persist-credentials: false

      - name: Checkout labelle-cli (main)
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-cli
          ref: main
          path: labelle-cli
          persist-credentials: false

      - name: Checkout labelle-gui for the labelle-cli build
        uses: actions/checkout@v4
        with:
          repository: labelle-toolkit/labelle-gui
          ref: main
          path: labelle-cli/zig-pkg/labelle-gui
          persist-credentials: false

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install raylib system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libsdl2-dev

      - name: Cache Zig artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            labelle-raylib/examples/gamepad/.labelle
          key: gamepad-example-${{ hashFiles('labelle-raylib/examples/gamepad/project.labelle', 'labelle-raylib/build.zig.zon') }}
          restore-keys: |
            gamepad-example-

      - name: Build labelle-assembler
        run: cd labelle-assembler && zig build

      - name: Build labelle-cli
        run: cd labelle-cli && zig build

      - name: Generate + build the gamepad desktop example
        env:
          LABELLE_ASSEMBLER: ${{ github.workspace }}/labelle-assembler/zig-out/bin/labelle-assembler
        run: |
          set -euo pipefail
          cd labelle-raylib/examples/gamepad
          $GITHUB_WORKSPACE/labelle-cli/zig-out/bin/labelle generate
          # The generated desktop project lands at .labelle/<backend>_desktop;
          # find its build.zig robustly (excluding the copied deps/ trees).
          proj=$(find .labelle -maxdepth 2 -name build.zig -not -path '*/deps/*' | head -1)
          if [ -z "$proj" ]; then echo "generated build.zig not found"; exit 1; fi
          echo "building: $proj"
          cd "$(dirname "$proj")"
          zig build

  # Missing-SDL2 message (labelle-cli#471 S2). On Windows, Zig has no default
  # SDL2 search path, so a desktop build with the gamepad source wired used
  # to die with a multi-line linker error when SDL2 was absent. The script
  # forces that case through the real wiring (`zig build sdl2-link-check`)
  # and asserts the ONE-line message, that `-Dgamepad_enabled=false` still
  # builds, and that a provisioned SDL2 (laid out like ~/.labelle/sdl2:
  # static archives hidden, SDL2.dll in lib/) links.
  sdl2-missing-windows:
    name: missing-SDL2 message (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SDL2_VERSION: 2.30.11
      SDL2_SHA256: 0590db0a47b564aab92499ed03eaa75db9aee17c371080caa3b05df9d49d9ff9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Provision SDL2 (MinGW devel) for the "present" scenario
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o sdl2.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          echo "${SDL2_SHA256}  sdl2.tar.gz" | sha256sum -c -
          tar xzf sdl2.tar.gz
          lib="$RUNNER_TEMP/SDL2-${SDL2_VERSION}/x86_64-w64-mingw32/lib"
          mv "$lib/libSDL2.a" "$lib/libSDL2.a.static-hidden"
          cp "$lib/../bin/SDL2.dll" "$lib/"
          echo "SDL2_PRESENT_LIB=$(cygpath -w "$lib")" >> "$GITHUB_ENV"
      - name: sdl2-link-check scenarios
        run: bash .github/scripts/sdl2-link-check.sh
